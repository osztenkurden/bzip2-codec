name: Release to npm

on:
    push:
        branches: [master]

permissions:
    id-token: write
    contents: write
    issues: write
    pull-requests: write

jobs:
    release-please:
        name: Release Please
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - id: release
              uses: googleapis/release-please-action@v5
              with:
                  release-type: node
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

    publish:
        name: Publish to npm
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - name: Verify source tag matches package version
              env:
                  RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
              run: node --input-type=module -e "import p from './package.json' with { type:'json' }; if (process.env.RELEASE_TAG !== 'v' + p.version) throw new Error('Release tag must match package version');"
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun run typecheck
            - run: npm test
            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ''
